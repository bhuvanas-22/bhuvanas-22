<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="100%" height="230">
  <defs>
    <!-- Background Gradient Matching Profile Theme -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2027" />
      <stop offset="50%" stop-color="#203A43" />
      <stop offset="100%" stop-color="#2C5364" />
    </linearGradient>

    <!-- Cyan Accent Glow -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ADB5" />
      <stop offset="50%" stop-color="#00FFF5" />
      <stop offset="100%" stop-color="#00ADB5" />
    </linearGradient>

    <!-- Subtle Radial Glow for Depth -->
    <radialGradient id="centerGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00FFF5" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0F2027" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .name-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      font-weight: 800;
      font-size: 54px;
      fill: #FFFFFF;
      letter-spacing: 2px;
    }
    .role-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #00FFF5;
      letter-spacing: 2px;
    }
    .tech-dots {
      fill: #FFFFFF;
      opacity: 0.12;
    }
    .accent-line {
      stroke: url(#cyanGlow);
      stroke-width: 2;
      stroke-dasharray: 4 4;
      opacity: 0.4;
    }
  </style>

  <!-- Base Waving Background -->
  <path fill="url(#bgGradient)" d="M0,0 L1200,0 L1200,165 C1080,210 930,150 780,185 C630,220 480,155 330,190 C180,225 70,160 0,175 Z" />

  <!-- Radial Glow Behind Name -->
  <rect x="0" y="0" width="1200" height="230" fill="url(#centerGlow)" />

  <!-- Ambient Decorative Tech Grid Dots -->
  <g class="tech-dots">
    <circle cx="80" cy="45" r="2.5" />
    <circle cx="115" cy="45" r="2.5" />
    <circle cx="150" cy="45" r="2.5" />
    <circle cx="80" cy="80" r="2.5" />
    <circle cx="115" cy="80" r="2.5" />
    <circle cx="150" cy="80" r="2.5" />
    <circle cx="80" cy="115" r="2.5" />
    <circle cx="115" cy="115" r="2.5" />
    <circle cx="150" cy="115" r="2.5" />

    <circle cx="1050" cy="45" r="2.5" />
    <circle cx="1085" cy="45" r="2.5" />
    <circle cx="1120" cy="45" r="2.5" />
    <circle cx="1050" cy="80" r="2.5" />
    <circle cx="1085" cy="80" r="2.5" />
    <circle cx="1120" cy="80" r="2.5" />
    <circle cx="1050" cy="115" r="2.5" />
    <circle cx="1085" cy="115" r="2.5" />
    <circle cx="1120" cy="115" r="2.5" />
  </g>

  <!-- Top Accent Highlight -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#cyanGlow)" />

  <!-- Main Name Text -->
  <text x="600" y="98" text-anchor="middle" class="name-title">Bhuvan A S</text>

  <!-- Subtitle Text -->
  <text x="600" y="140" text-anchor="middle" class="role-subtitle">AI &amp; ML Engineer &#8226; Full Stack &#8226; Generative AI</text>
</svg>

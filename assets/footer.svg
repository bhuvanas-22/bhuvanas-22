<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="100%" height="120">
  <defs>
    <!-- Background Gradient Matching Theme -->
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2027" />
      <stop offset="50%" stop-color="#203A43" />
      <stop offset="100%" stop-color="#2C5364" />
    </linearGradient>

    <!-- Cyan Accent Glow -->
    <linearGradient id="footerCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ADB5" />
      <stop offset="50%" stop-color="#00FFF5" />
      <stop offset="100%" stop-color="#00ADB5" />
    </linearGradient>
  </defs>

  <!-- Waving Footer Shape -->
  <path fill="url(#footerBg)" d="M0,60 C180,10 350,75 520,35 C690,0 850,60 1020,25 C1110,5 1160,30 1200,45 L1200,120 L0,120 Z" />

  <!-- Bottom Accent Highlight Bar -->

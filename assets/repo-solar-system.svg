<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Repo solar system of Bhuvan A S</title>
  <desc id="d">Animated solar system where each planet is a GitHub repository. Planet size is commits, colour is language, inner orbits are more recent.</desc>

  <style>
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
    .s{fill:#fff;opacity:.2;animation:tw 4s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.12}50%{opacity:.95}}
  </style>

  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0" stop-color="#121d3a"/><stop offset="1" stop-color="#060a15"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6c2"/><stop offset=".55" stop-color="#ffb703"/><stop offset="1" stop-color="#f97316"/>
    </radialGradient>
    <radialGradient id="corona" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffb703" stop-opacity=".55"/><stop offset="1" stop-color="#ffb703" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx=".32" cy=".28" r=".8">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".5"/>
    </radialGradient>
    <linearGradient id="gPy" x1="0" y1="0" x2="1" y2="1">
      <stop offset=".35" stop-color="#3776AB"/><stop offset=".85" stop-color="#FFD43B"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9be9ff" stop-opacity="0"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- ============ SPACE ============ -->
  <rect width="900" height="540" rx="16" fill="url(#bg)" stroke="#1f2a44"/>

  <!-- twinkling stars -->
  <g>
    <circle class="s" cx="60" cy="110" r="1.2" style="animation-delay:-1s"/>
    <circle class="s" cx="110" cy="470" r="1.4" style="animation-delay:-2s"/>
    <circle class="s" cx="230" cy="100" r="1" style="animation-delay:-3s"/>
    <circle class="s" cx="300" cy="500" r="1.2" style="animation-delay:-.5s"/>
    <circle class="s" cx="380" cy="92" r="1.1" style="animation-delay:-2.5s"/>
    <circle class="s" cx="520" cy="60" r="1.5" style="animation-delay:-1.5s"/>
    <circle class="s" cx="600" cy="42" r="1" style="animation-delay:-3.5s"/>
    <circle class="s" cx="700" cy="72" r="1.3" style="animation-delay:-.8s"/>
    <circle class="s" cx="782" cy="52" r="1" style="animation-delay:-2.2s"/>
    <circle class="s" cx="852" cy="112" r="1.4" style="animation-delay:-1.2s"/>
    <circle class="s" cx="872" cy="202" r="1" style="animation-delay:-3.1s"/>
    <circle class="s" cx="842" cy="302" r="1.2" style="animation-delay:-.3s"/>
    <circle class="s" cx="870" cy="402" r="1.5" style="animation-delay:-2.8s"/>
    <circle class="s" cx="800" cy="482" r="1" style="animation-delay:-1.8s"/>
    <circle class="s" cx="700" cy="506" r="1.3" style="animation-delay:-3.3s"/>
    <circle class="s" cx="600" cy="492" r="1" style="animation-delay:-.6s"/>
    <circle class="s" cx="500" cy="512" r="1.2" style="animation-delay:-2.1s"/>
    <circle class="s" cx="420" cy="486" r="1" style="animation-delay:-1.1s"/>
    <circle class="s" cx="330" cy="462" r="1.4" style="animation-delay:-3.7s"/>
    <circle class="s" cx="40" cy="300" r="1.2" style="animation-delay:-.9s"/>
    <circle class="s" cx="32" cy="200" r="1" style="animation-delay:-2.4s"/>
    <circle class="s" cx="76" cy="382" r="1.3" style="animation-delay:-1.7s"/>
    <circle class="s" cx="152" cy="342" r="1" style="animation-delay:-3.9s"/>
    <circle class="s" cx="252" cy="152" r="1.2" style="animation-delay:-.2s"/>
    <circle class="s" cx="652" cy="152" r="1" style="animation-delay:-2.6s"/>
    <circle class="s" cx="762" cy="182" r="1.4" style="animation-delay:-1.4s"/>
    <circle class="s" cx="122" cy="182" r="1.1" style="animation-delay:-3.2s"/>
    <circle class="s" cx="882" cy="472" r="1" style="animation-delay:-.7s"/>
    <circle class="s" cx="582" cy="112" r="1.2" style="animation-delay:-2.9s"/>
  </g>

  <!-- ============ HEADER ============ -->
  <text x="32" y="38" class="m" font-size="16" font-weight="700" fill="#e6edf3"><tspan fill="#2dd4bf">~/</tspan>bhuvanas-22<tspan fill="#a78bfa">/repo-solar-system</tspan></text>
  <text x="32" y="58" class="m" font-size="11" fill="#6e7681">planet size = commits  ·  colour = language  ·  inner orbit = most recent</text>

  <!-- ============ ORBIT RINGS ============ -->
  <g fill="none" stroke="#2a3760" stroke-width="1">
    <ellipse cx="450" cy="268" rx="130" ry="52"/>
    <ellipse cx="450" cy="268" rx="215" ry="86"/>
    <ellipse cx="450" cy="268" rx="300" ry="120"/>
    <ellipse cx="450" cy="268" rx="385" ry="154" stroke-dasharray="4 6" stroke-opacity=".7"/>
  </g>

  <!-- asteroid belt = the commit stream -->
  <ellipse cx="450" cy="268" rx="342" ry="137" fill="none" stroke="#8b949e" stroke-opacity=".55" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="1 8">
    <animate attributeName="stroke-dashoffset" values="0;-9" dur="2s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ============ SUN ============ -->
  <circle cx="450" cy="268" r="60" fill="url(#corona)">
    <animate attributeName="r" values="54;68;54" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="268" r="31" fill="url(#sun)"/>
  <text x="450" y="273" class="m" text-anchor="middle" font-size="15" font-weight="800" fill="#4a2200">BAS</text>

  <!-- ============ PLANETS (repos) ============ -->

  <!-- Orbit 1: EduGen — TypeScript -->
  <g>
    <animateMotion dur="18s" begin="-5s" repeatCount="indefinite" path="M 320,268 a130,52 0 1,1 260,0 a130,52 0 1,1 -260,0"/>
    <circle r="26" fill="#3178C6" opacity=".18"/>
    <circle r="16" fill="#3178C6"/>
    <circle r="16" fill="url(#shade)"/>
    <circle r="2.6" fill="#a5d6ff"><animateMotion dur="3s" repeatCount="indefinite" path="M -22,0 a22,22 0 1,1 44,0 a22,22 0 1,1 -44,0"/></circle>
    <circle r="2" fill="#d2a8ff"><animateMotion dur="5s" begin="-2s" repeatCount="indefinite" path="M -28,0 a28,28 0 1,0 56,0 a28,28 0 1,0 -56,0"/></circle>
    <text y="42" class="m" text-anchor="middle" font-size="12" font-weight="700" fill="#e6edf3">EduGen</text>
    <text y="54" class="m" text-anchor="middle" font-size="9" fill="#8b949e">LangGraph · RAG · FastAPI</text>
  </g>

  <!-- Orbit 2: RecruitPro — Python -->
  <g>
    <animateMotion dur="28s" begin="-16s" repeatCount="indefinite" path="M 235,268 a215,86 0 1,1 430,0 a215,86 0 1,1 -430,0"/>
    <circle r="30" fill="#4B8BBE" opacity=".18"/>
    <circle r="19" fill="url(#gPy)"/>
    <circle r="19" fill="url(#shade)"/>
    <circle r="2.6" fill="#44b78b"><animateMotion dur="4s" repeatCount="indefinite" path="M -26,0 a26,26 0 1,1 52,0 a26,26 0 1,1 -52,0"/></circle>
    <circle r="2.2" fill="#61dafb"><animateMotion dur="6.5s" begin="-3s" repeatCount="indefinite" path="M -33,0 a33,33 0 1,0 66,0 a33,33 0 1,0 -66,0"/></circle>
    <text y="47" class="m" text-anchor="middle" font-size="12" font-weight="700" fill="#e6edf3">RecruitPro</text>
    <text y="59" class="m" text-anchor="middle" font-size="9" fill="#8b949e">Django · React · Azure · LLM</text>
  </g>

  <!-- Orbit 3: cancer detection — Jupyter Notebook, with a "runner-up" ring -->
  <g>
    <animateMotion dur="40s" begin="-22s" repeatCount="indefinite" path="M 150,268 a300,120 0 1,1 600,0 a300,120 0 1,1 -600,0"/>
    <circle r="26" fill="#DA5B0B" opacity=".18"/>
    <circle r="14" fill="#DA5B0B"/>
    <circle r="14" fill="url(#shade)"/>
    <ellipse rx="26" ry="7" fill="none" stroke="#ffd166" stroke-width="2" opacity=".85" transform="rotate(-22)"/>
    <circle r="2.4" fill="#f78166"><animateMotion dur="5s" repeatCount="indefinite" path="M -32,0 a32,32 0 1,1 64,0 a32,32 0 1,1 -64,0"/></circle>
    <text y="44" class="m" text-anchor="middle" font-size="12" font-weight="700" fill="#e6edf3">Cancer-Detection</text>
    <text y="56" class="m" text-anchor="middle" font-size="9" fill="#ffd166">CNN · Streamlit · ★ 2nd place</text>
  </g>

  <!-- Orbit 4: the next repo (ghost planet) -->
  <g>
    <animateMotion dur="56s" begin="-34s" repeatCount="indefinite" path="M 65,268 a385,154 0 1,1 770,0 a385,154 0 1,1 -770,0"/>
    <circle r="11" fill="#0d1117" fill-opacity=".6" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="3 3">
      <animate attributeName="stroke-dashoffset" values="0;-12" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".45;1;.45" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text y="4" class="m" text-anchor="middle" font-size="11" fill="#8b949e">?</text>
    <text y="27" class="m" text-anchor="middle" font-size="11" font-weight="700" fill="#8b949e">next-repo</text>
    <text y="38" class="m" text-anchor="middle" font-size="9" fill="#6e7681">loading…</text>
  </g>

  <!-- ============ COMET ============ -->
  <g>
    <polygon points="-80,0 0,-2.4 0,2.4" fill="url(#tail)"/>
    <circle r="3.2" fill="#fff"/>
    <animateMotion dur="20s" rotate="auto" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.35;1" calcMode="linear" path="M 980,70 L -80,300"/>
  </g>

  <!-- ============ LEGEND ============ -->
  <g class="m" font-size="10" fill="#8b949e">
    <circle cx="40" cy="514" r="4" fill="#3178C6"/><text x="50" y="518">TypeScript</text>
    <circle cx="128" cy="514" r="4" fill="url(#gPy)"/><text x="138" y="518">Python</text>
    <circle cx="196" cy="514" r="4" fill="#DA5B0B"/><text x="206" y="518">Jupyter</text>
    <text x="868" y="518" text-anchor="end">moons = tech stack  ·  belt = commits</text>
  </g>
</svg>
